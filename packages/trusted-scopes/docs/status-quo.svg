<svg xmlns="http://www.w3.org/2000/svg" width="860" height="308" viewBox="0 0 860 308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#000">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="860" height="308" fill="#fff"/>

  <!-- Browser window -->
  <rect x="10" y="10" width="380" height="222" rx="8" fill="#fff" stroke="#333"/>
  <rect x="13" y="13" width="374" height="28" rx="14" fill="#fff" stroke="#333"/>
  <path d="M24,24 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="22" y="24" width="12" height="9" rx="1.5" fill="#333"/>
  <text x="43" y="32" font-size="13">example.com/profile</text>
  <line x1="10" y1="44" x2="390" y2="44" stroke="#333"/>

  <text x="13" y="62" font-size="15" font-weight="bold">MyExample</text>
  <text x="113" y="62" font-size="13">Home</text>
  <text x="165" y="62" font-size="13">Samples</text>
  <text x="233" y="62" font-size="13">Exemplars</text>
  <text x="387" y="62" font-size="13" text-anchor="end">Profile</text>
  <line x1="10" y1="68" x2="390" y2="68" stroke="#999"/>
  <text x="28" y="104" font-size="24" font-weight="bold">Profile</text>

  <text x="100" y="144" text-anchor="end" font-weight="bold">Name:</text>
  <rect x="106" y="126" width="220" height="26" fill="#fff" stroke="#333" stroke-dasharray="5 5"/>
  <text x="114" y="144">Roberta Jean Oppenheimer</text>

  <text x="100" y="180" text-anchor="end" font-weight="bold">SSN:</text>
  <rect x="106" y="162" width="110" height="26" fill="#fff" stroke="#333" stroke-dasharray="5 5"/>
  <text x="114" y="180">123-45-1701</text>

  <text x="100" y="216" text-anchor="end" font-weight="bold">Theme:</text>
  <text x="114" y="216">Dark</text>

  <!-- Server, in a cloud -->
  <path d="M612,209.8
           A37,29.3 0 0 1 598,160.7
           A43,34.1 0 0 1 600,105.2
           A45,35.7 0 0 1 625,51.3
           A37,29.3 0 0 1 680,25.8
           A43,34.1 0 0 1 750,25.8
           A37,29.3 0 0 1 805,51.3
           A45,35.7 0 0 1 830,105.2
           A43,34.1 0 0 1 832,160.7
           A37,29.3 0 0 1 818,209.8
           A33,26.2 0 0 1 760,219.3
           A53,42 0 0 1 680,219.3
           A42,33.3 0 0 1 612,209.8 z" fill="#fff" stroke="#333"/>
  <rect x="680" y="69.5" width="70" height="107" rx="3" fill="#fff" stroke="#333"/>
  <rect x="687" y="75" width="56" height="8" rx="1" fill="#fff" stroke="#333"/>
  <rect x="687" y="86.1" width="56" height="8" rx="1" fill="#fff" stroke="#333"/>
  <rect x="687" y="97.2" width="56" height="8" rx="1" fill="#fff" stroke="#333"/>
  <text x="715" y="57.5" text-anchor="middle" font-size="13">https://example.com:443</text>

  <!-- Response -->
  <line x1="680" y1="121" x2="392" y2="121" stroke="#333" marker-end="url(#arrowhead)"/>
  <text x="490" y="111" text-anchor="middle" font-size="13">HTML, JS, CSS, data, etc</text>

  <!-- Legend -->
  <rect x="10" y="246" width="12" height="12" fill="#fff" stroke="#333"/>
  <text x="30" y="256" font-size="10.5">Trusted</text>
  <rect x="10" y="267" width="12" height="12" fill="#ccc" stroke="#333"/>
  <text x="30" y="277" font-size="10.5">Untrusted</text>
  <rect x="10" y="288" width="12" height="12" fill="#fff" stroke="#333" stroke-dasharray="3 2"/>
  <text x="30" y="298" font-size="10.5">PII</text>
</svg>
