<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#000">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#fff"/>

  <!-- Browser window -->
  <rect x="10" y="10" width="380" height="280" rx="8" fill="#fff" stroke="#333"/>
  <rect x="24" y="22" width="352" height="28" rx="14" fill="#fff" stroke="#333"/>
  <text x="40" y="41" font-size="13">example.com/profile</text>
  <line x1="10" y1="62" x2="390" y2="62" stroke="#333"/>

  <text x="28" y="92" font-size="16" font-weight="bold">Example</text>
  <line x1="28" y1="104" x2="372" y2="104" stroke="#999"/>
  <text x="28" y="140" font-size="24" font-weight="bold">Profile</text>

  <text x="100" y="180" text-anchor="end" font-weight="bold">Name:</text>
  <rect x="106" y="162" width="220" height="26" fill="#fff" stroke="#333" stroke-dasharray="5 5"/>
  <text x="114" y="180">Roberta Jean Oppenheimer</text>

  <text x="100" y="216" text-anchor="end" font-weight="bold">SSN:</text>
  <rect x="106" y="198" width="110" height="26" fill="#fff" stroke="#333" stroke-dasharray="5 5"/>
  <text x="114" y="216">123-45-1701</text>

  <text x="100" y="252" text-anchor="end" font-weight="bold">Theme:</text>
  <text x="114" y="252">Dark</text>

  <!-- Server -->
  <rect x="580" y="40" width="200" height="60" fill="#fff" stroke="#333"/>
  <text x="680" y="75" text-anchor="middle">https://example.com:443</text>

  <!-- Response -->
  <line x1="580" y1="70" x2="392" y2="70" stroke="#333" marker-end="url(#arrowhead)"/>
  <text x="486" y="60" text-anchor="middle" font-size="13">HTML, JS, CSS, data, etc</text>

  <!-- Legend -->
  <rect x="640" y="196" width="16" height="16" fill="#fff" stroke="#333"/>
  <text x="666" y="209">Trusted</text>
  <rect x="640" y="226" width="16" height="16" fill="#ccc" stroke="#333"/>
  <text x="666" y="239">Untrusted</text>
  <rect x="640" y="256" width="16" height="16" fill="#fff" stroke="#333" stroke-dasharray="4 3"/>
  <text x="666" y="269">PII</text>
</svg>
