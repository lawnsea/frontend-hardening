<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="560" viewBox="0 0 1230 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#000">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <symbol id="lock" viewBox="0 0 12 16" overflow="visible">
      <path d="M2,7 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="#333" stroke-width="1.5"/>
      <rect y="7" width="12" height="9" rx="1.5" fill="#333"/>
    </symbol>
    <symbol id="cloud" viewBox="0 0 270 222" preserveAspectRatio="none" overflow="visible">
      <path d="M32,197.1
             A37,28.9 0 0 1 18,148.7
             A43,33.6 0 0 1 20,94
             A45,35.2 0 0 1 45,40.8
             A37,28.9 0 0 1 100,15.5
             A43,33.6 0 0 1 170,15.5
             A37,28.9 0 0 1 225,40.8
             A45,35.2 0 0 1 250,94
             A43,33.6 0 0 1 252,148.7
             A37,28.9 0 0 1 238,197.1
             A33,25.8 0 0 1 180,206.5
             A53,41.5 0 0 1 100,206.5
             A42,32.9 0 0 1 32,197.1 z" fill="inherit" stroke="#333" vector-effect="non-scaling-stroke"/>
    </symbol>
    <symbol id="server" viewBox="0 0 70 105.6" preserveAspectRatio="none" overflow="visible">
      <rect width="70" height="105.6" rx="3" fill="inherit" stroke="#333" vector-effect="non-scaling-stroke"/>
      <rect x="7" y="5.4" width="56" height="7.9" rx="1" fill="#fff" stroke="#333" vector-effect="non-scaling-stroke"/>
      <rect x="7" y="16.4" width="56" height="7.9" rx="1" fill="#fff" stroke="#333" vector-effect="non-scaling-stroke"/>
      <rect x="7" y="27.3" width="56" height="7.9" rx="1" fill="#fff" stroke="#333" vector-effect="non-scaling-stroke"/>
    </symbol>
    <symbol id="legend" viewBox="0 0 70 60" overflow="visible">
      <rect width="12" height="12" fill="#fff" stroke="#333"/>
      <text x="20" y="10" font-size="10.5">Trusted</text>
      <rect y="21" width="12" height="12" fill="#ccc" stroke="#333"/>
      <text x="20" y="31" font-size="10.5">Untrusted</text>
      <rect y="42" width="12" height="12" fill="#fff" stroke="#333" stroke-dasharray="3 2"/>
      <text x="20" y="52" font-size="10.5">PII</text>
    </symbol>
    <symbol id="database" viewBox="0 0 70 160" preserveAspectRatio="none" overflow="visible">
      <path d="M0,10 A35,10 0 0 1 70,10 V150 A35,10 0 0 1 0,150 Z" fill="inherit" stroke="#333" vector-effect="non-scaling-stroke"/>
      <path d="M0,10 A35,10 0 0 0 70,10" fill="none" stroke="#333" vector-effect="non-scaling-stroke"/>
    </symbol>
  </defs>
  <rect width="1230" height="560" fill="#fff"/>

  <!-- Browser window -->
  <g transform="translate(0,122)">
    <rect x="10" y="10" width="380" height="237" rx="8" fill="#fff" stroke="#333"/>
    <rect x="14" y="14" width="372" height="28" rx="8" fill="#fff" stroke="#333"/>
    <use href="#lock" x="23" y="18" width="12" height="16"/>
    <text x="44" y="33" font-size="13">example.com/profile</text>
    <line x1="10" y1="46" x2="390" y2="46" stroke="#333"/>

    <text x="16" y="60" font-size="11.25" font-weight="bold">MyExample</text>
    <text x="97" y="60" font-size="9.75">Home</text>
    <text x="141" y="60" font-size="9.75">Samples</text>
    <text x="197" y="60" font-size="9.75">Exemplars</text>
    <text x="384" y="60" font-size="9.75" text-anchor="end">Profile</text>
    <line x1="10" y1="65" x2="390" y2="65" stroke="#999"/>
    <text x="28" y="101" font-size="24" font-weight="bold">Profile</text>

    <text x="100" y="141" text-anchor="end" font-weight="bold">Name:</text>
    <rect x="106" y="123" width="220" height="26" fill="#fff" stroke="#333" stroke-dasharray="5 5"/>
    <text x="114" y="141">Roberta Jean Oppenheimer</text>

    <text x="100" y="177" text-anchor="end" font-weight="bold">Address:</text>
    <rect x="106" y="159" width="161" height="44" fill="#fff" stroke="#333" stroke-dasharray="5 5"/>
    <text x="114" y="177">1701D Enterprise Loop<tspan x="114" dy="18">Hollywood, CA 90068</tspan></text>

    <text x="100" y="231" text-anchor="end" font-weight="bold">Theme:</text>
    <text x="114" y="231">Dark</text>
  </g>

  <!-- Origin -->
  <use href="#cloud" x="520" y="10" width="700" height="480" fill="#fff"/>
  <text x="870" y="100" text-anchor="middle" font-size="13">https://example.com:443</text>
  <text x="635" y="160" text-anchor="middle" font-size="13">Web server</text>
  <text x="775" y="160" text-anchor="middle" font-size="13">GraphQL server</text>
  <text x="915" y="160" text-anchor="middle" font-size="13">Profile service</text>
  <text x="1055" y="160" text-anchor="middle" font-size="13">Profile DB</text>
  <use href="#server" x="600" y="170" width="70" height="160" fill="#fff"/>
  <use href="#server" x="740" y="170" width="70" height="160" fill="#fff"/>
  <use href="#server" x="880" y="170" width="70" height="160" fill="#fff"/>
  <use href="#database" x="1020" y="170" width="70" height="160" fill="#fff"/>
  <line x1="670" y1="250" x2="738" y2="250" stroke="#333" marker-end="url(#arrowhead)"/>
  <text x="705" y="242" text-anchor="middle" font-size="13">query</text>
  <line x1="810" y1="250" x2="878" y2="250" stroke="#333" marker-end="url(#arrowhead)"/>
  <text x="845" y="242" text-anchor="middle" font-size="13">request</text>
  <line x1="950" y1="250" x2="1018" y2="250" stroke="#333" marker-end="url(#arrowhead)"/>
  <text x="985" y="242" text-anchor="middle" font-size="13">read</text>

  <!-- Build and deploy -->
  <rect x="600" y="380" width="90" height="40" rx="3" fill="#fff" stroke="#333"/>
  <text x="645" y="405" text-anchor="middle" font-size="13">Origin code</text>
  <line x1="690" y1="400" x2="718" y2="400" stroke="#333" marker-end="url(#arrowhead)"/>
  <rect x="720" y="380" width="110" height="40" rx="3" fill="#fff" stroke="#333"/>
  <text x="775" y="405" text-anchor="middle" font-size="13">CI service</text>
  <rect x="715" y="505" width="120" height="40" rx="3" fill="#fff" stroke="#333"/>
  <text x="775" y="530" text-anchor="middle" font-size="13">Third-party code</text>
  <line x1="775" y1="505" x2="775" y2="422" stroke="#333" marker-end="url(#arrowhead)"/>
  <path d="M635,350 H915 M775,380 V350" fill="none" stroke="#333"/>
  <line x1="635" y1="350" x2="635" y2="332" stroke="#333" marker-end="url(#arrowhead)"/>
  <line x1="775" y1="350" x2="775" y2="332" stroke="#333" marker-end="url(#arrowhead)"/>
  <line x1="915" y1="350" x2="915" y2="332" stroke="#333" marker-end="url(#arrowhead)"/>
  <text x="783" y="370" font-size="13">deploy</text>

  <!-- Requests and responses -->
  <line x1="392" y1="185" x2="598" y2="185" stroke="#333" marker-end="url(#arrowhead)"/>
  <text x="455" y="179" text-anchor="middle" font-size="13">GET /profile</text>
  <line x1="598" y1="195" x2="392" y2="195" stroke="#333" marker-end="url(#arrowhead)"/>
  <text x="455" y="210" text-anchor="middle" font-size="13">page HTML</text>
  <line x1="392" y1="245" x2="598" y2="245" stroke="#333" marker-end="url(#arrowhead)"/>
  <text x="455" y="239" text-anchor="middle" font-size="13">GET /app.js</text>
  <line x1="598" y1="255" x2="392" y2="255" stroke="#333" marker-end="url(#arrowhead)"/>
  <text x="455" y="270" text-anchor="middle" font-size="13">page JS</text>
  <line x1="392" y1="305" x2="598" y2="305" stroke="#333" marker-end="url(#arrowhead)"/>
  <text x="455" y="299" text-anchor="middle" font-size="13">GET /app.css</text>
  <line x1="598" y1="315" x2="392" y2="315" stroke="#333" marker-end="url(#arrowhead)"/>
  <text x="455" y="330" text-anchor="middle" font-size="13">page CSS</text>

  <!-- Legend -->
  <g transform="translate(0,122)">
    <use href="#legend" x="10" y="261" width="70" height="60"/>
  </g>
</svg>
