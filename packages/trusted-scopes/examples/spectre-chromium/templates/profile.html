<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Profile</title>
    {{head}}
  </head>
  <body>
    <h1>Profile</h1>
    <dl>
      <dt>Name:</dt>
      <dd id="name" data-ciphertext="{{ciphertext}}"></dd>
    </dl>
    <script>
      window.trustedScopes?.createScope("pii").then((pii) => {
        const name = document.getElementById("name");
        name.append(pii.createFrame("/" + name.dataset.ciphertext));
      });
    </script>
    {{body}}
  </body>
</html>
